[mgr]
prepend_keymap = [
  { on = ["g", "i"],  run = "shell --block -- lazygit", desc = "lazygit im aktuellen Ordner" },
  { on = ["g", "r"], run = "cd /programmieren/repos", desc = "Gehe zu /programmieren/repos" },
  { on = ["g", "u"], run = "cd /run/media/$USER", desc = "USB-Laufwerke" },
]
