---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input
    - storage
    - network

autologinGroup:     autologin
doAutologin:        false
sudoersGroup:       wheel
setRootPassword:    true
doReusePassword:    true

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root, live ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "sArch-${cpu}"
    forbidden_names: [ localhost ]
