# sArch – Calamares-Hauptkonfiguration (Live-ISO)
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       hostcopy
  module:   shellprocess
  config:   shellprocess_hostcopy.conf
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf
- id:       sarchuser
  module:   shellprocess
  config:   shellprocess_sarchuser.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - shellprocess@hostcopy      # Mirrorliste aus dem Live-System übernehmen
  - shellprocess@cleanup       # Live-Reste weg, Kernel/mkinitcpio, Live-Pakete entfernen
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@sarchuser     # sArch-Desktop für den neuen Benutzer
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: sarch
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
